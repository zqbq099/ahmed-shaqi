name: بناء أحمد شاقي APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: تثبيت Buildozer
        run: |
          pip install buildozer
          sudo apt update
          sudo apt install -y python3-pip python3-dev python3-setuptools git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      
      - name: بناء APK
        run: |
          export BUILDOZER_ALLOW_ROOT=1
          buildozer android debug
      
      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: Ahmed-Shaqi-APK
          path: bin/*.apk
