name: بناء تطبيق أحمد شاقي APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04   # نسخة مستقرة
    steps:
      - name: تحميل الكود
        uses: actions/checkout@v4

      - name: تثبيت حزم النظام الأساسية
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-setuptools \
            python3-dev \
            build-essential \
            git \
            autoconf \
            automake \
            libtool \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            openjdk-17-jdk \
            unzip \
            wget \
            libltdl-dev

      - name: تثبيت Buildozer ومتطلباته
        run: |
          pip3 install --user --upgrade Cython==0.29.33
          pip3 install --user --upgrade buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: تثبيت مكتبة Pillow لصنع الأيقونة
        run: pip3 install --user Pillow

      - name: صنع أيقونة تلقائية
        run: |
          python3 -c "
          from PIL import Image, ImageDraw, ImageFont
          import os
          img = Image.new('RGB', (512, 512), color=(18, 18, 18))
          draw = ImageDraw.Draw(img)
          draw.ellipse((20, 20, 492, 492), outline=(255, 215, 0), width=15)
          draw.ellipse((150, 150, 362, 362), outline=(255, 215, 0), width=12)
          try:
              font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 140)
          except:
              font = ImageFont.load_default()
          draw.text((256, 220), 'A S', fill=(255, 215, 0), anchor='mm', font=font)
          os.makedirs('assets', exist_ok=True)
          img.save('assets/icon.png')
          print('✅ تم إنشاء الأيقونة في assets/icon.png')
          "

      - name: بناء الـ APK
        env:
          BUILDOZER_ALLOW_ROOT: 1
        run: |
          yes | buildozer android debug

      - name: رفع الـ APK كقطعة أثرية (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Ahmed-Shaqi-APK
          path: bin/*.apk
